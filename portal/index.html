<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacks</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 56rem; margin: 0 auto; padding: 2.5rem 1rem; }
      h1 { margin: 0; font-size: 1.75rem; }
      .intro { margin: 0.5rem 0 2rem; color: var(--muted); }
      .apps { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      @media (min-width: 640px) { .apps { grid-template-columns: 1fr 1fr; } }
      a.app {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.app:hover { border-color: var(--accent); }
      .icon { font-size: 2rem; line-height: 1; }
      .name { font-size: 1.25rem; font-weight: 600; }
      .desc { color: var(--muted); }
      .go { margin-top: auto; padding-top: 0.5rem; color: var(--accent); font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stacks</h1>
      <p class="intro">Choisis ce que tu veux apprendre aujourd'hui.</p>
      <div class="apps">
        <a class="app" href="/data/">
          <span class="icon">🧱</span>
          <span class="name">StackData</span>
          <span class="desc">Le rôle de chaque techno dans une stack tech et data, et composer une stack adaptée à un besoin.</span>
          <span class="go">Ouvrir →</span>
        </a>
        <a class="app" href="/politique/">
          <span class="icon">🏛</span>
          <span class="name">StackPolitique</span>
          <span class="desc">Les mouvements politiques français : histoire, idées, programme et figures de chaque parti.</span>
          <span class="go">Ouvrir →</span>
        </a>
      </div>
    </main>
  </body>
</html>
